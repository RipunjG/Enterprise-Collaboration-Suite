<!DOCTYPE html>
<html>
<head>
    <title>Enterprise Chat & History</title>
    <style>
        .container { display: flex; height: 90vh; font-family: sans-serif; }
        .sidebar { width: 30%; border-right: 1px solid #ccc; padding: 15px; background: #f9f9f9; }
        .chat-area { width: 70%; padding: 15px; display: flex; flex-direction: column; }
        #messages { flex: 1; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; background: #fff; border-radius: 5px; }
        .msg { padding: 8px 12px; margin: 5px 0; border-radius: 10px; max-width: 60%; }
        .my-msg { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
        .other-msg { background: #efefef; align-self: flex-start; }
        .meta { font-size: 0.7em; color: #555; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div style="padding: 10px; background: #eee;">
        <label>My Username:</label>
        <input id="myUsername" value="alice">
        <button onclick="connect()">Log In</button>
        <span id="status" style="margin-left:10px; color:red;">Disconnected</span>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>Start Chat</h3>
            
            <label>Chat with User:</label><br>
            <input id="targetUser" placeholder="bob">
            <button onclick="selectDM()">Open Chat</button>
            <br><br>
            
            <label>Chat with Team (ID):</label><br>
            <input id="targetTeam" placeholder="1">
            <button onclick="selectTeam()">Open Team</button>
            
            <hr>
            <h4>Current: <span id="chatTitle" style="color:blue">None</span></h4>
        </div>

        <div class="chat-area">
            <div id="messages"></div>
            <div style="margin-top:10px; display:flex;">
                <input id="msgInput" placeholder="Type a message..." style="flex:1; padding:10px;">
                <button onclick="sendMessage()" style="padding:10px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        var ws;
        var mode = "dm"; // 'dm' or 'team'
        var myName = "";
        var activeTarget = "";

        function connect() {
            myName = document.getElementById("myUsername").value;
            ws = new WebSocket("ws://localhost:8000/chat/ws/" + myName);
            
            ws.onopen = function() { 
                document.getElementById("status").innerText = "Connected as " + myName;
                document.getElementById("status").style.color = "green";
            };
            
            ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                // Only show if the message belongs to current active chat
                if (shouldDisplayMessage(data)) {
                    displayMessage(data.from, data.msg, false);
                }
            };
        }

        // --- FETCH HISTORY LOGIC ---

        async function selectDM() {
            mode = "dm";
            activeTarget = document.getElementById("targetUser").value;
            document.getElementById("chatTitle").innerText = "DM: " + activeTarget;
            document.getElementById("messages").innerHTML = ""; // Clear screen
            
            // Fetch History from Backend
            const response = await fetch(`http://localhost:8000/chat/history/dm/${activeTarget}?my_username=${myName}`);
            const history = await response.json();
            
            history.forEach(msg => {
                var isMe = (msg.from === myName);
                displayMessage(msg.from, msg.msg, isMe);
            });
        }

        async function selectTeam() {
            mode = "team";
            activeTarget = document.getElementById("targetTeam").value;
            document.getElementById("chatTitle").innerText = "Team ID: " + activeTarget;
            document.getElementById("messages").innerHTML = ""; // Clear screen

            const response = await fetch(`http://localhost:8000/chat/history/team/${activeTarget}`);
            const history = await response.json();
            
            history.forEach(msg => {
                var isMe = (msg.from === myName);
                displayMessage(msg.from, msg.msg, isMe);
            });
        }

        // --- SEND LOGIC ---

        function sendMessage() {
            var msg = document.getElementById("msgInput").value;
            if(!msg) return;

            var payload = {};
            if (mode === "dm") {
                payload = { "type": "dm", "to": activeTarget, "msg": msg };
            } else {
                payload = { "type": "team", "team_id": parseInt(activeTarget), "msg": msg };
            }

            ws.send(JSON.stringify(payload));
            displayMessage(myName, msg, true); // Show my own message instantly
            document.getElementById("msgInput").value = "";
        }

        function displayMessage(sender, text, isMe) {
            var div = document.createElement("div");
            div.className = "msg " + (isMe ? "my-msg" : "other-msg");
            div.innerHTML = `<span class="meta">${sender}</span>${text}`;
            document.getElementById("messages").appendChild(div);
            // Auto scroll to bottom
            var container = document.getElementById("messages");
            container.scrollTop = container.scrollHeight;
        }

        function shouldDisplayMessage(data) {
            // Logic to check if incoming message belongs to the current open window
            if (mode === "dm" && data.type === "dm" && data.from === activeTarget) return true;
            if (mode === "team" && data.type === "team" && data.team === document.getElementById("chatTitle").innerText.split(": ")[1]) return true; // Simple check
            return false;
        }
    </script>
</body>
</html>
